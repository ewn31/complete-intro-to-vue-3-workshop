<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app">
      <h1>{{ showTitle }}</h1>
      <p>Released: <i>{{firstAired}}</i>, Still Running: {{ stillRunning ? "Yes" : "No" }} </p>
      <h2>Synopsis</h2>
      <p>{{ synopsis }}</p>
      <p><b>Genre: </b> <span v-for="topic in genre"> <i>{{ topic + " " }}</i> </span> </p>
      <h2>Characters</h2>
      <ul v-if="characters.length > 0">
        <li v-for="character in characters">{{ character }}</li>
      </ul>
      <p v-else>No characters</p>
    </div>
  </body>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    const { createApp } = Vue
    const app = createApp({
      data(){
        return{
          showTitle: "Peaky Blinders",
          synopsis: "A crime drama about a Birmingham family gang known as the Peaky Blinders. The show takes place in England from 1919 to 1930's before the start of the second world war ",
          genre: ['crime', 'drama', 'action'],
          characters: ["Thomas Shelby", "Arthur Shelby", "Aunt Poly", "Finn shelby"],
          numberOfSeasons: 6,
          firstAired: 2014,
          stillRunning: false
        }
      }
    })

    app.mount("#app")
  </script>
</html>
